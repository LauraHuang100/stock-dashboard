<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>WMA Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/plotly.js/2.26.0/plotly.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', sans-serif; background: #0d1117; color: #e6edf3; min-height: 100vh; }
  body, html { width: 100%; }
  .app-shell { width: 100%; max-width: 980px; margin: 0 auto; padding: 18px 16px 36px; }
  .app-header { background: #0f1720; border: 1px solid #21262d; border-radius: 24px; padding: 20px 22px; margin-bottom: 18px; box-shadow: 0 16px 40px rgba(0,0,0,0.18); }
  .app-header h1 { font-size: 1.7rem; color: #58a6ff; margin-bottom: 8px; }
  .app-header p { color: #8b949e; font-size: 0.95rem; line-height: 1.5; }
  .card { background: #0f1720; border: 1px solid #21262d; border-radius: 24px; box-shadow: 0 18px 36px rgba(0,0,0,0.14); overflow: hidden; }
  .card + .card { margin-top: 18px; }
  .panel-card, .chart-card { padding: 20px; }
  .panel-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
  .control-group { display: flex; flex-direction: column; gap: 10px; }
  .panel-label { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 8px; }
  .label-text { color: #8b949e; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; }
  .status-badge { display: inline-flex; align-items: center; justify-content: center; padding: 10px 14px; border-radius: 999px; background: rgba(88, 106, 255, 0.14); color: #cdd9ff; font-size: 0.78rem; font-weight: 600; }
  select { appearance: none; background: #111827; border: 1px solid #2b3449; border-radius: 14px; color: #e6edf3; padding: 12px 14px; font-size: 0.95rem; cursor: pointer; }
  select:focus { outline: 1px solid #58a6ff; }
  #chart { width: 100%; min-height: 520px; border-radius: 22px; overflow: hidden; }
  .signal-bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 18px 20px; background: #0f1720; border: 1px solid #21262d; border-radius: 24px; margin-top: 18px; }
  .signal-bar span:first-child { color: #8b949e; font-size: 0.75rem; }
  .signal { padding: 8px 12px; border-radius: 999px; font-size: 0.79rem; font-weight: 600; }
  .bullish { background: rgba(63, 185, 80, 0.14); color: #9be7a5; border: 1px solid #238636; }
  .bearish { background: rgba(248, 81, 73, 0.14); color: #ffb3b0; border: 1px solid #da3633; }
  .neutral { background: rgba(62, 147, 255, 0.14); color: #9cc4ff; border: 1px solid #388bfd; }
  footer { text-align: center; padding: 16px 0 0; font-size: 0.76rem; color: #7d8895; }
  .empty-state { color: #8b949e; text-align: center; padding: 34px 18px; }
  @media (max-width: 820px) {
    .panel-row { grid-template-columns: 1fr; }
    .app-shell { padding: 16px 14px 32px; }
    .chart-card { padding: 18px; }
    .panel-card { padding: 18px; }
  }
  @media (max-width: 560px) {
    .app-header h1 { font-size: 1.5rem; }
    .app-header p { font-size: 0.9rem; }
    select { font-size: 0.95rem; padding: 14px 14px; }
    #chart { min-height: 360px; }
    .signal-bar { padding: 14px 16px; }
  }
</style>
</head>
<body>
<div class="app-shell">
  <header class="app-header">
    <h1>📈 WMA Dashboard</h1>
    <p>Weighted Moving Average analysis with chart controls and signal summaries. Updated by your Python workflow.</p>
  </header>

  <div class="card panel-card">
    <div class="panel-row">
      <div class="control-group">
        <div class="panel-label">
          <span class="label-text">Ticker</span>
          <span class="status-badge" id="status">Loading…</span>
        </div>
        <select id="ticker-select"></select>
      </div>

      <div class="control-group">
        <div class="panel-label"><span class="label-text">Time horizon</span></div>
        <select id="horizon-select">
          <option value="short-term" selected>Short-term (2025–present)</option>
          <option value="long-term">Long-term</option>
        </select>
      </div>
    </div>
  </div>

  <div class="card chart-card">
    <div class="panel-label" style="margin-bottom: 16px;">
      <span class="label-text">Interactive chart</span>
      <span class="status-badge">App-style UI</span>
    </div>
    <div id="chart"></div>
  </div>

  <div class="signal-bar" id="signal-bar">
    <span>Signals:</span>
  </div>

  <footer>Data fetched via Yahoo Finance • Refresh page or use cron to update</footer>
</div>

<script>
const tickerSelect = document.getElementById('ticker-select');
const horizonSelect = document.getElementById('horizon-select');
const statusEl = document.getElementById('status');
const signalBar = document.getElementById('signal-bar');
const chartContainer = document.getElementById('chart');
const DATA_URL = `./chart_data.json?cacheBust=${Date.now()}`;
let CHART_DATA = null;

async function loadChartData() {
  statusEl.textContent = 'Loading latest data…';
  chartContainer.innerHTML = '';

  try {
    const response = await fetch(DATA_URL, { cache: 'no-store' });
    if (!response.ok) {
      throw new Error(`HTTP ${response.status}`);
    }

    const payload = await response.json();
    CHART_DATA = payload.data ?? payload;
    statusEl.textContent = 'Ready';
    initializeTickerSelect();
    renderChart();
  } catch (error) {
    statusEl.textContent = 'Data load failed';
    chartContainer.innerHTML = `<div class="empty-state">Unable to load chart data: ${error.message}</div>`;
  }
}

function computeWMA(prices, period) {
  const weights = Array.from({ length: period }, (_, i) => i + 1);
  const weightSum = weights.reduce((sum, value) => sum + value, 0);
  return prices.map((price, index) => {
    if (index < period - 1) return null;
    let total = 0;
    for (let j = 0; j < period; j += 1) {
      total += prices[index - period + 1 + j] * weights[j];
    }
    return Math.round((total / weightSum) * 10000) / 10000;
  });
}

function getSignal(prices, wma20, wma50, wma200) {
  const index = prices.length - 1;
  const price = prices[index];
  const score = [price > wma20[index], price > wma50[index], price > wma200[index], wma20[index] > wma50[index]].filter(Boolean).length;
  if (score >= 4) return 'bullish';
  if (score <= 1) return 'bearish';
  return 'neutral';
}

function initializeTickerSelect() {
  if (!CHART_DATA) {
    tickerSelect.innerHTML = '<option value="">No symbols</option>';
    statusEl.textContent = 'No data available';
    chartContainer.innerHTML = '<div class="empty-state">Chart data is unavailable. Run the update script and refresh.</div>';
    return;
  }

  const tickers = Object.keys(CHART_DATA).sort();
  tickerSelect.innerHTML = tickers.map(ticker => `<option value="${ticker}">${ticker}</option>`).join('');
  if (tickers.length === 0) {
    tickerSelect.innerHTML = '<option value="">No symbols</option>';
    statusEl.textContent = 'No data available';
    chartContainer.innerHTML = '<div class="empty-state">No tickers found in the dashboard data.</div>';
    return;
  }
  tickerSelect.value = tickers[0];
  statusEl.textContent = 'Ready';
}

function renderChart() {
  if (!CHART_DATA) return;
  const ticker = tickerSelect.value;
  const data = CHART_DATA[ticker];
  if (!data) {
    statusEl.textContent = 'Ticker not found';
    chartContainer.innerHTML = '<div class="empty-state">Unable to render selected ticker.</div>';
    return;
  }

  const prices = data.close;
  const dates = data.dates;
  const wma20 = computeWMA(prices, 20);
  const wma50 = computeWMA(prices, 50);
  const wma200 = computeWMA(prices, 200);
  const shortTerm = horizonSelect.value === 'short-term';
  const startDate = shortTerm ? '2025-01-01' : dates[0];

  const visiblePrices = prices.filter((_, index) => dates[index] >= startDate && prices[index] > 0);
  const minPrice = Math.min(...visiblePrices);
  const maxPrice = Math.max(...visiblePrices);
  const range = maxPrice - minPrice;
  const padding = Math.max(0.08, range / maxPrice * 0.1) * range;
  const yaxisRange = [Math.max(0, minPrice - padding), maxPrice + padding];

  const trace = {
    type: 'candlestick',
    x: dates,
    open: data.open,
    high: data.high,
    low: data.low,
    close: prices,
    increasing: { line: { color: '#3fb950' }, fillcolor: '#3fb950' },
    decreasing: { line: { color: '#f85149' }, fillcolor: '#f85149' },
    name: ticker,
  };

  const chartData = [
    trace,
    { type: 'scatter', mode: 'lines', x: dates, y: wma20, name: 'WMA 20', line: { color: '#f0c040', width: 1.5 } },
    { type: 'scatter', mode: 'lines', x: dates, y: wma50, name: 'WMA 50', line: { color: '#58a6ff', width: 2 } },
    { type: 'scatter', mode: 'lines', x: dates, y: wma200, name: 'WMA 200', line: { color: '#ff6b6b', width: 2.5 } },
  ];

  const layout = {
    paper_bgcolor: '#0d1117',
    plot_bgcolor: '#0d1117',
    font: { color: '#e6edf3', family: 'Segoe UI, sans-serif' },
    title: { text: `${ticker} — Weighted Moving Averages`, font: { size: 16 } },
    xaxis: {
      type: 'date',
      range: [startDate, dates[dates.length - 1]],
      tickformat: '%b %Y',
      tickangle: -45,
      tickfont: { size: 10 },
      showgrid: true,
      gridcolor: '#21262d',
      rangeslider: { visible: false },
      hoverformat: '%Y-%m-%d',
    },
    yaxis: {
      tickprefix: '$',
      range: yaxisRange,
      autorange: false,
      gridcolor: '#21262d',
      showgrid: true,
      zeroline: false,
    },
    legend: { orientation: 'h', y: 1.05, bgcolor: 'transparent' },
    margin: { t: 60, l: 64, r: 24, b: 80 },
    hovermode: 'x unified',
  };

  Plotly.react('chart', chartData, layout, {
    responsive: true,
    scrollZoom: true,
    displayModeBar: true,
    modeBarButtonsToRemove: ['lasso2d', 'select2d'],
  });

  statusEl.textContent = `Last updated: ${dates[dates.length - 1]} | ${prices.length} trading days`;
  updateSignalBar();
}

function updateSignalBar() {
  if (!CHART_DATA) return;
  signalBar.innerHTML = '<span>Signals:</span>';
  Object.entries(CHART_DATA).forEach(([symbol, data]) => {
    const wma20 = computeWMA(data.close, 20);
    const wma50 = computeWMA(data.close, 50);
    const wma200 = computeWMA(data.close, 200);
    const signal = getSignal(data.close, wma20, wma50, wma200);
    const badge = document.createElement('span');
    badge.className = `signal ${signal}`;
    badge.textContent = `${symbol} ${signal === 'bullish' ? '▲' : signal === 'bearish' ? '▼' : '●'} ${signal}`;
    badge.onclick = () => {
      tickerSelect.value = symbol;
      renderChart();
    };
    badge.style.cursor = 'pointer';
    signalBar.appendChild(badge);
  });
}

tickerSelect.addEventListener('change', renderChart);
horizonSelect.addEventListener('change', renderChart);
loadChartData();
</script>
</body>
</html>
