name: Daily Stock Dashboard

on:
  schedule:
    - cron: '0 22 * * 1-5'  # Runs at 22:00 UTC on weekdays, after US market close
  workflow_dispatch:

permissions:
  contents: write

env:
  GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
  GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
  GMAIL_RECIPIENT: ${{ secrets.GMAIL_RECIPIENT }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Print Python version
        run: |
          python --version

      - name: Print pip packages
        run: |
          pip list

      - name: Check Gmail secrets are present
        run: |
          if [ -n "${GMAIL_SENDER}" ]; then
            echo "GMAIL_SENDER secret exists"
          else
            echo "GMAIL_SENDER secret missing"
          fi

          if [ -n "${GMAIL_PASSWORD}" ]; then
            echo "GMAIL_PASSWORD secret exists"
          else
            echo "GMAIL_PASSWORD secret missing"
          fi

          if [ -n "${GMAIL_RECIPIENT}" ]; then
            echo "GMAIL_RECIPIENT secret exists"
          else
            echo "GMAIL_RECIPIENT secret missing"
          fi

      - name: Run SMTP test
        run: |
          python test_email.py

      - name: Run Dashboard Script
        run: |
          python update_dashboard.py

      - name: Commit Updated Dashboard
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          git add index.html chart_data.json
          git commit -m "Daily dashboard update" || echo "No changes"
          git push
