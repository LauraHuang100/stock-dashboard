      - name: Send Email Notification
        run: |
          python <<EOF
          import smtplib
          import os
          from email.mime.text import MIMEText
          from datetime import datetime
          from zoneinfo import ZoneInfo

          sender = os.environ["GMAIL_SENDER"]
          password = os.environ["GMAIL_PASSWORD"]
          recipient = os.environ["GMAIL_RECIPIENT"]

          dashboard_url = "https://laurahuang100.github.io/stock-dashboard/"

          now = datetime.now(ZoneInfo("America/New_York"))

          formatted_time = now.strftime("%Y-%m-%d %I:%M %p %Z")

          body = f"""
          Daily stock dashboard update completed successfully.

          Dashboard Link:
          {dashboard_url}

          Updated:
          {formatted_time}
          """

          msg = MIMEText(body)

          msg["Subject"] = "Daily Stock Dashboard Updated"
          msg["From"] = sender
          msg["To"] = recipient

          print("Connecting to Gmail SMTP...")

          server = smtplib.SMTP("smtp.gmail.com", 587)
          server.starttls()

          print("Logging in...")
          server.login(sender, password)

          print("Sending email...")
          server.sendmail(sender, recipient, msg.as_string())

          server.quit()

          print("SUCCESS: Email sent.")
          EOF